{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login | BYU Patrol Center</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f8f9fa; margin: 0; }
        .login-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        input { display: block; width: 100%; margin: 10px 0; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #002e5d; color: white; border: none; border-radius: 4px; cursor: pointer; }
	.logo { width: 140px; height: auto; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-box">
	<img src="{% static 'Monogram/PNG/BYU_logo.png' %}" alt="BYU Logo" class="logo">

        <h2>Patrol Dashboard</h2>
        {% if form.errors %}
            <p style="color: red;">Invalid username or password.</p>
        {% endif %}
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            {{ form.username.label_tag }}
            {{ form.username }}
            
            {{ form.password.label_tag }}
            {{ form.password }}
            
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
